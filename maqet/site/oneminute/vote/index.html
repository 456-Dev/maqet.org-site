<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audience Vote · The 1 Minute Film Festival</title>
<meta name="description" content="Pick your top 3 films of the night. Results show when voting closes.">
<meta name="theme-color" content="#C23A0B">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Courier+Prime:wght@400;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: the call sheet again. Header + timer, a grid of film stills you tap in order (1st, 2nd, 3rd), a sticky ballot strip with your name. When time runs out the grid turns into the results. */
:root {
  --frame: #C23A0B; --paper: #FFFFFF; --ink: #111111; --faint: #6E6460; --hairline: #CFC8C4;
  --magenta: #E3157D; --highlight: #FFF400; --pen: #1A27E0; --green: #0F9A6C;
  --display: "Momo Trust Display", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --mono: "Courier Prime", "Courier New", Courier, monospace;
  --marker: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--frame); color: var(--ink); font-family: var(--mono); font-size: 1.05rem; line-height: 1.45; padding: clamp(10px, 2.4vw, 36px); }
.sheet { background: var(--paper); max-width: 1120px; margin: 0 auto; padding: clamp(18px, 3vw, 36px) clamp(16px, 4vw, 52px) 0; }
a { color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px dashed var(--pen); outline-offset: 3px; }
mark { background: linear-gradient(transparent 12%, var(--highlight) 12% 88%, transparent 88%); color: inherit; padding-inline: .15em; }
.k { margin: 0; font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem 2rem; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 1.1rem; }
header a.back { font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-decoration: none; }
h1 { margin: .35rem 0 .2rem; font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 7vw, 4.6rem); line-height: .95; text-transform: uppercase; }
.sub { margin: .5rem 0 0; max-width: 40rem; }
.clock { text-align: right; }
.clock .t { font-family: var(--display); font-size: clamp(2.4rem, 8vw, 5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.clock .t.hot { color: var(--magenta); }
.clock .note { font-family: var(--marker); color: var(--pen); font-size: 1.15rem; transform: rotate(-2deg); display: inline-block; }
.voters { margin: .9rem 0 0; font-size: .9rem; color: var(--faint); }
.voters b { color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: clamp(14px, 2vw, 24px); padding: 1.4rem 0 1.6rem; }
.film { position: relative; display: grid; gap: .45rem; align-content: start; padding: 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.film:disabled { cursor: default; }
.film .still { position: relative; aspect-ratio: 16 / 9; background: #EEE9E6; border: 2px solid var(--ink); overflow: hidden; display: grid; place-items: center; }
.film .still img { width: 100%; height: 100%; object-fit: cover; display: block; }
.film .still .noimg { font-family: var(--display); font-size: 2.6rem; color: var(--hairline); }
.film .name { font-weight: 700; font-size: 1.05rem; line-height: 1.2; text-transform: uppercase; }
.film .team { font-size: .85rem; color: var(--faint); margin-top: -.3rem; }
.film .badge { position: absolute; top: -12px; left: -12px; width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--magenta); color: #fff; display: grid; place-items: center; font-family: var(--marker); font-size: 1.35rem; transform: rotate(-8deg) scale(0); transition: transform .15s; z-index: 2; box-shadow: 0 2px 0 var(--ink); }
.film.on .badge { transform: rotate(-8deg) scale(1); }
.film.on .still { border-color: var(--magenta); outline: 4px solid var(--magenta); }
.film:not(:disabled):hover .still { outline: 4px solid var(--highlight); }
.film.on:hover .still { outline-color: var(--magenta); }

.ballot { position: sticky; bottom: 0; z-index: 5; margin: 0 calc(-1 * clamp(16px, 4vw, 52px)); padding: .9rem clamp(16px, 4vw, 52px) calc(.9rem + env(safe-area-inset-bottom)); background: var(--paper); border-top: 2px solid var(--ink); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem .8rem; }
.slot { border: 1px dashed var(--faint); padding: .35rem .5rem; min-height: 2.9rem; font-size: .82rem; line-height: 1.2; overflow: hidden; }
.slot .p { display: block; font-family: var(--marker); color: var(--magenta); font-size: .95rem; }
.slot.full { border-style: solid; border-color: var(--ink); font-weight: 700; text-transform: uppercase; }
.ballot .row { grid-column: 1 / -1; display: flex; gap: .8rem; flex-wrap: wrap; }
.ballot input { flex: 1 1 12rem; min-width: 0; font: inherit; font-size: 1.05rem; padding: .55rem .2rem; border: 0; border-bottom: 2px solid var(--ink); }
.ballot button { font-family: var(--display); font-size: 1.15rem; letter-spacing: .04em; padding: .55em 1.2em; border: 0; background: var(--ink); color: #fff; cursor: pointer; }
.ballot button:disabled { opacity: .35; cursor: not-allowed; }
.bmsg { grid-column: 1 / -1; margin: 0; font-weight: 700; min-height: 1.2em; }
.bmsg.err { color: #B00020; }
.bmsg.ok { color: var(--green); }

/* results */
.results { padding: 1.6rem 0 2.4rem; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 2vw, 24px); align-items: end; }
.pod { display: grid; gap: .4rem; }
.pod .place { font-family: var(--marker); font-size: clamp(1.4rem, 3vw, 2.2rem); color: var(--magenta); transform: rotate(-3deg); }
.pod .still { aspect-ratio: 16 / 9; border: 3px solid var(--ink); background: #EEE9E6; overflow: hidden; }
.pod .still img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pod .name { font-family: var(--display); font-size: clamp(1.05rem, 2.4vw, 1.9rem); line-height: 1.05; text-transform: uppercase; }
.pod .pts { font-weight: 700; }
.pod.r1 { order: 2; } .pod.r2 { order: 1; } .pod.r3 { order: 3; }
.pod.r1 .still { border-color: var(--magenta); outline: 5px solid var(--highlight); }
.pod.r2, .pod.r3 { padding-top: clamp(0px, 4vw, 48px); }
.table { margin-top: 2rem; border-top: 2px solid var(--ink); }
.trow { display: grid; grid-template-columns: 2.6rem minmax(0, 1.4fr) minmax(0, 2fr) 4.5rem; gap: .8rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid var(--hairline); }
.trow .rk { font-family: var(--display); font-size: 1.3rem; }
.trow .nm { font-weight: 700; text-transform: uppercase; line-height: 1.15; }
.trow .nm small { display: block; font-weight: 400; text-transform: none; color: var(--faint); }
.bar { height: 14px; background: var(--magenta); min-width: 2px; }
.trow .pt { text-align: right; font-weight: 700; }
.scoring { margin-top: 1rem; font-size: .85rem; color: var(--faint); }
.err { padding: 2rem 0; font-weight: 700; }
@media (max-width: 640px) {
  header { grid-template-columns: 1fr; }
  .clock { text-align: left; }
  .podium { grid-template-columns: 1fr; }
  .pod.r1, .pod.r2, .pod.r3 { order: 0; padding-top: 0; }
  .trow { grid-template-columns: 2rem minmax(0, 1fr) 3.6rem; }
  .trow .barw { display: none; }
  .ballot { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .slot { font-size: .72rem; }
}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div>
      <a class="back" href="/oneminute/">← THE 1 MINUTE FILM FESTIVAL</a>
      <h1 id="title">Audience vote</h1>
      <p class="sub" id="sub">Tap your <mark>top 3 films</mark> in order: first tap = 1st place. Write your name and send it.</p>
      <p class="voters" id="voters"></p>
    </div>
    <div class="clock">
      <p class="k" id="clockk">Voting</p>
      <div class="t" id="clock">—</div>
      <span class="note" id="clocknote"></span>
    </div>
  </header>

  <main id="grid" class="grid" aria-label="Films"></main>
  <section id="results" class="results" hidden aria-label="Results"></section>
  <p class="err" id="err" hidden></p>

  <form class="ballot" id="ballot" hidden novalidate>
    <div class="slot" data-i="0"><span class="p">1st</span><span class="v">tap a film</span></div>
    <div class="slot" data-i="1"><span class="p">2nd</span><span class="v">tap a film</span></div>
    <div class="slot" data-i="2"><span class="p">3rd</span><span class="v">tap a film</span></div>
    <div class="row">
      <input id="name" name="name" autocomplete="name" maxlength="60" placeholder="Your name" aria-label="Your name">
      <button id="submit" type="submit" disabled>VOTE</button>
    </div>
    <p class="bmsg" id="bmsg" role="status"></p>
  </form>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const PLACE = ["1st", "2nd", "3rd"];

  let data = null, skew = 0, picks = [], need = 3, rendered = "";
  try { picks = JSON.parse(localStorage.getItem("fest-picks") || "[]"); } catch (e) {}
  $("name").value = localStorage.getItem("fest-name") || "";

  function voters(list) {
    const n = list.length;
    $("voters").replaceChildren(el("b", null, String(n)), document.createTextNode(n === 1 ? " person has voted" : " people have voted"));
    if (n) $("voters").append(document.createTextNode(": " + list.join(", ")));
  }

  function syncPicks() {
    const ids = data ? data.films.map((f) => f.id) : [];
    picks = picks.filter((id) => ids.includes(id)).slice(0, need);
    document.querySelectorAll(".film").forEach((b) => {
      const i = picks.indexOf(b.dataset.id);
      b.classList.toggle("on", i >= 0);
      b.querySelector(".badge").textContent = i >= 0 ? PLACE[i] : "";
      b.setAttribute("aria-pressed", i >= 0);
    });
    document.querySelectorAll(".slot").forEach((s) => {
      const i = +s.dataset.i, f = data && data.films.find((x) => x.id === picks[i]);
      s.hidden = i >= need;
      s.classList.toggle("full", !!f);
      s.querySelector(".v").textContent = f ? f.name : "tap a film";
    });
    $("submit").disabled = picks.length !== need || data.phase !== "open";
    localStorage.setItem("fest-picks", JSON.stringify(picks));
  }

  function renderGrid() {
    const open = data.phase === "open";
    const key = data.films.map((f) => f.id + f.name + f.team + f.img).join("|") + open;
    if (key === rendered) return;
    rendered = key;
    $("grid").replaceChildren(...data.films.map((f, n) => {
      const b = el("button", "film"); b.type = "button"; b.dataset.id = f.id; b.disabled = !open;
      const st = el("div", "still");
      if (f.img) { const im = el("img"); im.src = f.img; im.alt = f.name; im.loading = "lazy"; st.append(im); }
      else st.append(el("span", "noimg", String(n + 1)));
      b.append(el("span", "badge"), st, el("span", "name", f.name));
      if (f.team) b.append(el("span", "team", f.team));
      b.onclick = () => {
        const i = picks.indexOf(f.id);
        if (i >= 0) picks.splice(i, 1); else if (picks.length < need) picks.push(f.id); else picks[need - 1] = f.id;
        $("bmsg").textContent = ""; syncPicks();
      };
      return b;
    }));
    syncPicks();
  }

  function renderResults() {
    const r = data.results || [];
    const max = Math.max(1, ...r.map((f) => f.points));
    const sec = $("results");
    const pod = el("div", "podium");
    r.filter((f) => f.rank <= 3 && f.points > 0).slice(0, 3).forEach((f, i) => {
      const d = el("div", "pod r" + (i + 1));
      d.append(el("span", "place", PLACE[f.rank - 1] + " place"));
      const st = el("div", "still"); if (f.img) { const im = el("img"); im.src = f.img; im.alt = f.name; st.append(im); }
      d.append(st, el("span", "name", f.name));
      d.append(el("span", "pts", f.points + " pts" + (f.team ? " · " + f.team : "")));
      pod.append(d);
    });
    const tbl = el("div", "table");
    r.forEach((f) => {
      const row = el("div", "trow");
      const nm = el("span", "nm", f.name); if (f.team) nm.append(el("small", null, f.team));
      const bw = el("span", "barw"); const bar = el("div", "bar"); bar.style.width = (100 * f.points / max) + "%"; bw.append(bar);
      row.append(el("span", "rk", String(f.rank)), nm, bw, el("span", "pt", f.points + " pts"));
      tbl.append(row);
    });
    const sc = el("p", "scoring", "Scoring: 1st pick = 3 pts, 2nd = 2, 3rd = 1. Ties go to more 1st-place picks. " + data.voters.length + " ballots.");
    sec.replaceChildren(r.length && r[0].points > 0 ? pod : el("p", null, "No votes came in."), tbl, sc);
  }

  function tick() {
    if (!data) return;
    const now = Date.now() + skew;
    const c = $("clock"), note = $("clocknote");
    if (data.phase === "open") {
      const left = Math.max(0, Date.parse(data.closes) - now);
      const s = Math.ceil(left / 1000);
      c.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      c.classList.toggle("hot", s <= 30);
      $("clockk").textContent = "Time left to vote";
      note.textContent = s <= 30 ? "hurry!" : "";
      if (left <= 0) load();
    } else if (data.phase === "before") {
      c.textContent = "SOON"; c.classList.remove("hot");
      $("clockk").textContent = "Voting opens";
      note.textContent = "after the last film";
    } else {
      c.textContent = "CLOSED"; c.classList.remove("hot");
      $("clockk").textContent = "Voting";
      note.textContent = "here are the winners";
    }
  }

  function apply(d) {
    data = d;
    skew = Date.parse(d.now) - Date.now();
    need = Math.min(3, d.films.length);
    voters(d.voters);
    const closed = d.phase === "closed";
    $("title").textContent = closed ? "The results" : "Audience vote";
    $("sub").innerHTML = closed ? "The audience has spoken." :
      d.phase === "before" ? "When voting opens, tap your <mark>top 3 films</mark> in order. Results show when time runs out." :
      "Tap your <mark>top 3 films</mark> in order: first tap = 1st place. Write your name and send it. Vote again with the same name to change it.";
    $("grid").hidden = closed;
    $("results").hidden = !closed;
    $("ballot").hidden = d.phase !== "open";
    if (closed) renderResults(); else renderGrid();
    if (!d.films.length && !closed) { $("grid").replaceChildren(el("p", null, "Films go up here once they're in.")); rendered = ""; }
    tick();
  }

  let loading = false;
  function load() {
    if (loading) return; loading = true;
    fetch("/api/fest", { cache: "no-store" }).then((r) => r.json()).then((d) => { $("err").hidden = true; apply(d); })
      .catch(() => { if (!data) { $("err").textContent = "Couldn't load the films. Refresh in a sec."; $("err").hidden = false; } })
      .finally(() => { loading = false; });
  }

  $("ballot").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("name").value.trim(), msg = $("bmsg");
    msg.className = "bmsg err";
    if (picks.length !== need) { msg.textContent = "Tap " + need + " films first."; return; }
    if (name.length < 2) { msg.textContent = "Write your name so we know who voted."; $("name").focus(); return; }
    $("submit").disabled = true; msg.className = "bmsg"; msg.textContent = "Sending…";
    fetch("/api/fest/vote", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, picks }) })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        syncPicks();
        if (!ok) { msg.className = "bmsg err"; msg.textContent = d.error || "That didn't go through. Try again."; return; }
        localStorage.setItem("fest-name", name);
        voters(d.voters);
        msg.className = "bmsg ok"; msg.textContent = "Got it, " + name + ". Change your picks and vote again any time before the clock hits 0.";
      })
      .catch(() => { syncPicks(); msg.className = "bmsg err"; msg.textContent = "No connection. Try again."; });
  });

  load();
  setInterval(tick, 250);
  setInterval(() => { if (!data || data.phase !== "closed" || !data.results) load(); }, 4000);
  // keep polling slowly after close so a reset/re-open is picked up
  setInterval(() => { if (data && data.phase === "closed") load(); }, 20000);
})();
</script>
</body>
</html>
