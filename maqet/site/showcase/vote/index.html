<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voting sheet · Daily MAQET Showcase</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;900&display=swap">
<style>
/* Layout: the week's numbered pieces, one per row, every file playable. Private: only reachable with the week's token. */
:root {
  --paper: #FFFFFF; --ink: rgba(0, 0, 0, 0.85); --grey: rgba(106, 106, 106, 0.85); --rule: rgba(0, 0, 0, 0.75);
  --star: rgba(228, 24, 180, 0.85);
  --sans: "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --pad: clamp(16px, 4.4vw, 64px); --text: clamp(16px, 1.45vw, 19px);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: var(--text); line-height: 1.25; padding: clamp(24px, 4vw, 56px) var(--pad) 56px; }
a { color: inherit; }
p { margin: 0; }
[hidden] { display: none !important; }
.logo { margin: 0 0 1.6rem; font-size: clamp(20px, 2.4vw, 30px); font-weight: 500; letter-spacing: .3em; }
.logo .star { color: var(--star); }
.kicker { color: var(--star); font-size: .82em; font-weight: 700; letter-spacing: .1em; }
h1 { margin: .3rem 0 .8rem; font-size: clamp(1.8em, 4vw, 2.8em); font-weight: 900; letter-spacing: .04em; text-transform: uppercase; line-height: 1.05; }
.how { display: grid; gap: .35rem; max-width: 46rem; }
.how code { font: inherit; font-weight: 900; background: #f2f2f2; padding: .05em .35em; }
.jump { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1.2rem 0 0; }
.jump a { min-width: 2.4em; text-align: center; padding: .3em .5em; border: 1px solid var(--rule); text-decoration: none; font-weight: 700; }
.jump a:hover { background: var(--star); color: #fff; border-color: var(--star); }
hr { height: 1px; margin: 1.6rem 0 0; border: 0; background: var(--rule); }

.piece { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) minmax(0, 1fr); gap: 1rem clamp(16px, 3vw, 44px); padding: clamp(20px, 3vw, 40px) 0; border-bottom: 1px solid var(--rule); scroll-margin-top: 12px; }
.num { font-size: clamp(2.4em, 5vw, 3.6em); font-weight: 900; color: var(--star); line-height: .9; }
.stage { position: relative; background: #f2f2f2; display: grid; place-items: center; min-height: 12rem; }
.stage img, .stage video { display: block; max-width: 100%; max-height: 78vh; width: auto; height: auto; }
.stage audio { width: 100%; margin-top: .6rem; }
.nav { position: absolute; top: 50%; translate: 0 -50%; width: 2.4em; height: 2.4em; border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font: inherit; font-weight: 900; cursor: pointer; }
.nav.prev { left: .5em; } .nav.next { right: .5em; }
.slide-n { position: absolute; top: .5em; right: .5em; padding: .1em .45em; background: rgba(0,0,0,.6); color: #fff; font-size: .75em; font-weight: 700; }
.info { display: grid; gap: .45rem; align-content: start; }
.artist { font-size: 1.25em; font-weight: 900; letter-spacing: .06em; }
.meta { color: var(--grey); font-size: .9em; }
.cap-k { margin-top: .6rem; font-size: .72em; font-weight: 700; letter-spacing: .14em; color: var(--grey); }
.cap { white-space: pre-wrap; }
.missing { padding: 2rem; color: var(--grey); text-align: center; }
.err { margin-top: 2rem; font-weight: 700; }
.pick { justify-self: start; margin-top: .8rem; font: inherit; font-weight: 900; letter-spacing: .08em; padding: .6em 1.1em; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
.pick[aria-pressed="true"] { background: var(--star); border-color: var(--star); color: #fff; }
.pick:disabled { opacity: .35; cursor: not-allowed; }
.piece.picked .num { text-decoration: underline; text-underline-offset: .12em; }
.ballot { position: sticky; bottom: 0; z-index: 5; margin: 0 calc(-1 * var(--pad)); padding: .9rem var(--pad) calc(.9rem + env(safe-area-inset-bottom)); background: #fff; border-top: 2px solid var(--ink); display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; }
.ballot .tally { font-weight: 900; letter-spacing: .06em; }
.ballot .tally b { color: var(--star); }
.ballot input { flex: 1 1 12rem; min-width: 0; font: inherit; padding: .5rem .2rem; border: 0; border-bottom: 1px solid var(--rule); }
.ballot button { font: inherit; font-weight: 900; letter-spacing: .06em; padding: .65em 1.2em; border: 0; background: var(--ink); color: #fff; cursor: pointer; }
.ballot button:disabled { opacity: .4; cursor: not-allowed; }
.ballot .bmsg { flex-basis: 100%; font-weight: 700; }
.ballot .bmsg.err { margin: 0; color: #b00020; }
.voters { margin-top: .6rem; }
.voters b { color: var(--star); font-weight: 900; }
@media (max-width: 760px) {
  .piece { grid-template-columns: 2.6em minmax(0, 1fr); }
  .info { grid-column: 2; }
  .stage { grid-column: 2; }
}
</style>
</head>
<body>
<p class="logo">M<span class="star">☆</span>QET COLLECTIVE</p>
<p class="kicker">DAILY MAQET SHOWCASE · VOTING SHEET</p>
<h1 id="theme">This week</h1>
<div class="how">
  <p id="count"></p>
  <p id="howto">Tap <b>VOTE</b> on your 7 favorites, add your name at the bottom and submit.</p>
  <p class="meta" id="rules">Vote again with the same name to change it; your last vote counts. The top 7 post to @_maqet_, one a day.</p>
  <p class="voters" id="voters"></p>
</div>
<nav class="jump" id="jump"></nav>
<hr>
<main id="pieces"></main>
<p class="err" id="err" hidden></p>
<form class="ballot" id="ballot" hidden novalidate>
  <span class="tally"><b id="picked">0</b> / <span id="need">7</span> picked</span>
  <input id="name" name="name" autocomplete="name" maxlength="60" placeholder="Your name">
  <button id="submit" type="submit" disabled>SUBMIT VOTE</button>
  <p class="bmsg" id="bmsg" role="status"></p>
</form>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const week = q.get("w"), t = q.get("t");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function stage(p) {
    const box = el("div", "stage");
    const visual = p.files.filter((f) => f.role !== "audio");
    const song = p.files.find((f) => f.role === "audio");
    if (!p.files.length) { box.append(el("p", "missing", "The file for this piece couldn't be loaded.")); return box; }
    let at = 0;
    const view = el("div");
    const count = el("span", "slide-n");
    function show() {
      const f = visual[at];
      let m;
      if (f.mime.startsWith("video/")) { m = el("video"); Object.assign(m, { src: f.url, controls: true, playsInline: true, preload: "metadata" }); }
      else { m = el("img"); m.src = f.url; m.alt = (p.title || "Work") + " by " + p.artist; m.loading = "lazy"; }
      view.replaceChildren(m);
      count.textContent = (at + 1) + " / " + visual.length;
    }
    if (visual.length) {
      box.append(view); show();
      if (visual.length > 1) {
        const prev = el("button", "nav prev", "‹"), next = el("button", "nav next", "›");
        prev.setAttribute("aria-label", "Previous slide"); next.setAttribute("aria-label", "Next slide");
        prev.onclick = () => { at = (at - 1 + visual.length) % visual.length; show(); };
        next.onclick = () => { at = (at + 1) % visual.length; show(); };
        let x0 = null;
        view.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
        view.addEventListener("touchend", (e) => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) (dx < 0 ? next : prev).onclick(); x0 = null; });
        box.append(prev, next, count);
      }
    }
    if (song) { const a = el("audio"); Object.assign(a, { src: song.url, controls: true, preload: "metadata" }); box.append(a); }
    return box;
  }

  let need = 7, open = false;
  const chosen = new Set();
  function showVoters(list) {
    const n = list.length;
    $("voters").innerHTML = "";
    const b = el("b", null, String(n));
    $("voters").append(b, document.createTextNode(n === 1 ? " person has voted" : " people have voted"));
    if (n) $("voters").append(document.createTextNode(": " + list.join(", ")));
  }
  function sync() {
    document.querySelectorAll(".pick").forEach((b) => {
      const on = chosen.has(b.dataset.id);
      b.setAttribute("aria-pressed", on);
      b.textContent = on ? "VOTED ★" : "VOTE ☆";
      b.disabled = !on && chosen.size >= need;
      b.closest(".piece").classList.toggle("picked", on);
    });
    $("picked").textContent = chosen.size;
    $("submit").disabled = chosen.size !== need;
    localStorage.setItem("maqet-picks-" + week, JSON.stringify([...chosen]));
  }
  $("ballot").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("name").value.trim();
    const msg = $("bmsg");
    msg.className = "bmsg err";
    if (name.length < 2) { msg.textContent = "Add your name so we know who voted."; $("name").focus(); return; }
    if (chosen.size !== need) { msg.textContent = "Pick exactly " + need + "."; return; }
    $("submit").disabled = true; msg.className = "bmsg"; msg.textContent = "Sending…";
    fetch("/api/showcase/sheet/" + encodeURIComponent(week) + "/vote?t=" + encodeURIComponent(t), {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, picks: [...chosen] }),
    }).then((r) => r.json().then((d) => ({ ok: r.ok, d }))).then(({ ok, d }) => {
      $("submit").disabled = chosen.size !== need;
      if (!ok) { msg.className = "bmsg err"; msg.textContent = d.error || "That didn't go through. Try again."; return; }
      localStorage.setItem("maqet-voter", name);
      showVoters(d.voters);
      msg.className = "bmsg"; msg.textContent = "Thanks, " + name + ". Your vote is in. You can change it until voting closes.";
    }).catch(() => { $("submit").disabled = false; msg.className = "bmsg err"; msg.textContent = "That didn't go through. Check your connection and try again."; });
  });

  if (!week || !t) { $("err").textContent = "This voting link is missing its code. Use the link from the WhatsApp group."; $("err").hidden = false; return; }
  fetch("/api/showcase/sheet/" + encodeURIComponent(week) + "?t=" + encodeURIComponent(t), { cache: "no-store" })
    .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) { $("err").textContent = d.error || "This voting link isn't valid."; $("err").hidden = false; return; }
      $("theme").textContent = d.theme || "This week";
      document.title = (d.theme || "Voting sheet") + " · Daily MAQET Showcase";
      $("count").textContent = d.pieces.length + " pieces this week.";
      need = d.need;
      $("need").textContent = need;
      $("howto").innerHTML = "Tap <b>VOTE</b> on your " + (need === 7 ? "7 favorites" : need + " favorites") + ", add your name at the bottom and submit.";
      showVoters(d.voters);
      const closes = new Date(d.closes);
      const when = closes.toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" });
      $("rules").textContent = (d.open ? "Voting closes " + when + ". " : "Voting closed " + when + ". ") + "Vote again with the same name to change it; your last vote counts. The top 7 post to @_maqet_, one a day.";
      open = d.open;
      $("name").value = localStorage.getItem("maqet-voter") || "";
      const saved = JSON.parse(localStorage.getItem("maqet-picks-" + week) || "[]");
      saved.forEach((id) => { if (d.pieces.some((p) => p.id === id)) chosen.add(id); });
      $("ballot").hidden = !open;
      const rows = d.pieces.map((p, i) => {
        const n = i + 1;
        const row = el("article", "piece"); row.id = String(n);
        const info = el("div", "info");
        info.append(el("p", "artist", p.artist));
        const meta = [p.title, p.mediaType, p.handle ? "@" + p.handle.replace(/^@/, "") : ""].filter(Boolean).join(" · ");
        info.append(el("p", "meta", meta));
        if (p.caption) { info.append(el("p", "cap-k", "SUGGESTED CAPTION"), el("p", "cap", p.caption)); }
        const btn = el("button", "pick", "VOTE ☆");
        btn.type = "button"; btn.dataset.id = p.id;
        btn.onclick = () => { chosen.has(p.id) ? chosen.delete(p.id) : chosen.add(p.id); sync(); };
        if (open) info.append(btn);
        row.append(el("p", "num", String(n)), stage(p), info);
        const a = el("a", null, String(n)); a.href = "#" + n; $("jump").append(a);
        return row;
      });
      $("pieces").replaceChildren(...rows);
      sync();
      if (location.hash) { const target = document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); }
    })
    .catch(() => { $("err").textContent = "Couldn't load this week's pieces. Try again in a minute."; $("err").hidden = false; });
})();
</script>
</body>
</html>
